[project]
name = "svtax"
version = "1.0.0"
description = "The Survivorship Tax: measuring how much of a factor backtest is an artifact of its own shortcuts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "yfinance>=1.7",
]

[project.optional-dependencies]
dev = ["mypy>=1.9", "pandas-stubs", "pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svtax"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213",   # incompatible docstring conventions; D211/D212 chosen instead
    "COM812",         # conflicts with the formatter
    "S310",           # URLs here are module-level constants, not user input
    "T201",           # scripts print progress on purpose
    "CPY001",         # no per-file copyright header; the LICENSE covers the repo
    "N812",           # `import numpy as np` style aliases for math modules are idiomatic
    "TC001", "TC002", "TC003",  # runtime-needed imports; dataclasses resolve annotations
    "PLR0913", "PLR0917",       # the backtest engine takes its panels explicitly,
                                # which is the point: no hidden global state
    "D401",           # docstrings here describe findings, not imperative actions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",      # pytest asserts
    "PLR2004",   # thresholds in tests are the test
    "D100", "D101", "D102", "D103", "D107",
    "INP001",
    "PLC0415",   # local imports keep test fixtures self-contained
    "FBT003",    # keyword booleans in test calls are readable
]
"scripts/*" = [
    "INP001", "D100", "S607",
    # A research driver is one long linear procedure on purpose: the order in which
    # sections run is the record of how the study was run. Splitting it into helpers
    # to satisfy a complexity budget would hide that order, not clarify it.
    "C901", "PLR0915", "PLR0912", "PLR0911",
    "PLC0415",   # deferred imports keep the heavy engine out of `--help` paths
]
"scripts/smoke_pipeline.py" = [
    # This script IS a test; its asserts are the checks. It is invoked by CI as
    # `python scripts/smoke_pipeline.py`, never under -O, so they always run.
    "S101",
]

[tool.mypy]
python_version = "3.12"
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
